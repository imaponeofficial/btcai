<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SCALPER AI Trader PRO — Painel Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@400;600;700;900&display=swap');
:root{
  --bg:#07090f;--bg2:#0c1018;--bg3:#111824;--border:#1a2840;
  --accent:#00d4ff;--green:#00e676;--red:#ff1744;--yellow:#ffd600;
  --text:#b0cce0;--text2:#4a7090;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;min-height:100vh}

/* LOGIN GATE */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-box{width:min(360px,100%);background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;padding:28px 24px}
.gate-logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#00d4ff,#0055aa);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;margin:0 auto 14px}
.gate-title{text-align:center;font-size:14px;font-weight:900;letter-spacing:2px;color:#fff;margin-bottom:2px}
.gate-sub{text-align:center;font-size:11px;color:var(--text2);margin-bottom:20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;letter-spacing:1px;color:var(--text2);margin-bottom:5px;font-weight:700}
.field input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:11px 12px;color:#fff;font-size:13px;font-family:inherit}
.field input:focus{outline:none;border-color:var(--accent)}
.gate-btn{width:100%;padding:12px;margin-top:6px;background:linear-gradient(135deg,var(--accent),#0099cc);
  border:none;border-radius:8px;color:#001018;font-weight:800;font-size:12px;letter-spacing:1px;cursor:pointer}
.gate-btn:disabled{opacity:.6;cursor:default}
.gate-err{font-size:11.5px;color:var(--red);margin-top:10px;display:none;line-height:1.5}
.gate-denied{font-size:12px;color:var(--red);text-align:center;line-height:1.6;padding:8px 0}

/* DASHBOARD */
#dash{display:none;max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.dash-top{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.dash-logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#00d4ff,#0055aa);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff}
.dash-title{font-size:14px;font-weight:900;letter-spacing:1.5px;color:#fff}
.dash-title span{color:var(--accent)}
.dash-logout{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text2);
  padding:7px 12px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer}
.dash-logout:hover{color:var(--red);border-color:var(--red)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px}
.stat-num{font-size:22px;font-weight:900;color:#fff;font-family:'Share Tech Mono',monospace}
.stat-label{font-size:10px;color:var(--text2);letter-spacing:.5px;margin-top:2px}

.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;color:#fff;font-size:12.5px;font-family:inherit}
.search:focus{outline:none;border-color:var(--accent)}
.filter-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text2);padding:8px 12px;
  border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.filter-btn.active{color:var(--accent);border-color:var(--accent);background:rgba(0,212,255,.08)}
.refresh-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text2);padding:8px 10px;
  border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.refresh-btn:hover{color:var(--accent);border-color:var(--accent)}

.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:10px;letter-spacing:1px;color:var(--text2);font-weight:700;
  padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:12px 14px;font-size:12.5px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.02)}
.email-cell{color:#fff;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;
  font-size:10px;font-weight:800;letter-spacing:.5px}
.badge-assinante{background:rgba(0,230,118,.12);color:var(--green);border:1px solid rgba(0,230,118,.3)}
.badge-teste{background:rgba(0,212,255,.1);color:var(--accent);border:1px solid rgba(0,212,255,.3)}
.badge-free{background:rgba(255,255,255,.05);color:var(--text2);border:1px solid var(--border)}
.trial-timer{font-family:'Share Tech Mono',monospace;font-size:12px;padding:3px 8px;border-radius:5px;
  display:inline-block}
.trial-timer.tg{color:var(--green);background:rgba(0,230,118,.1)}
.trial-timer.ty{color:var(--yellow);background:rgba(255,214,0,.1)}
.trial-timer.tr{color:var(--red);background:rgba(255,23,68,.12)}
.trial-timer.expired{color:var(--text2);background:rgba(255,255,255,.04)}
.dash-empty{color:var(--text2);font-size:11px}

.toggle{position:relative;width:40px;height:22px;border-radius:11px;background:var(--border);
  border:none;cursor:pointer;flex-shrink:0;transition:background .2s}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform .2s}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(18px)}
.toggle:disabled{opacity:.35;cursor:not-allowed}
.toggle.loading{opacity:.6;cursor:wait}

.mobile-list{display:none}
.m-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.m-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.m-email{color:#fff;font-weight:700;font-size:13px;word-break:break-all}
.m-row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;
  color:var(--text2);padding:6px 0;border-top:1px solid var(--border)}
.m-row:first-of-type{border-top:none;padding-top:0}

@media (max-width:760px){
  .table-wrap{display:none}
  .mobile-list{display:block}
}

.loading-row{text-align:center;padding:30px;color:var(--text2);font-size:12px}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">√</div>
    <div class="gate-title">PAINEL ADMIN</div>
    <div class="gate-sub">SCALPER AI Trader PRO</div>
    <div class="field">
      <label>E-MAIL</label>
      <input id="admin-email" type="email" placeholder="seu@email.com" autocomplete="username">
    </div>
    <div class="field">
      <label>SENHA</label>
      <input id="admin-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="gate-btn" id="gate-btn" onclick="doAdminLogin()">ENTRAR</button>
    <div class="gate-err" id="gate-err"></div>
  </div>
</div>

<div id="dash">
  <div class="dash-top">
    <div class="dash-logo">√</div>
    <div class="dash-title">SCALPER<span>AI</span> · ADMIN</div>
    <button class="dash-logout" onclick="doAdminLogout()">SAIR</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-total">—</div><div class="stat-label">TOTAL DE CLIENTES</div></div>
    <div class="stat"><div class="stat-num" id="stat-assinantes" style="color:var(--green)">—</div><div class="stat-label">ASSINANTES</div></div>
    <div class="stat"><div class="stat-num" id="stat-teste" style="color:var(--accent)">—</div><div class="stat-label">EM TESTE</div></div>
    <div class="stat"><div class="stat-num" id="stat-free" style="color:var(--text2)">—</div><div class="stat-label">FREE</div></div>
  </div>

  <div class="toolbar">
    <input class="search" id="search-input" placeholder="Buscar por e-mail..." oninput="renderTable()">
    <button class="filter-btn active" data-f="todos" onclick="setFilter('todos')">TODOS</button>
    <button class="filter-btn" data-f="assinante" onclick="setFilter('assinante')">ASSINANTES</button>
    <button class="filter-btn" data-f="teste" onclick="setFilter('teste')">TESTE</button>
    <button class="filter-btn" data-f="free" onclick="setFilter('free')">FREE</button>
    <button class="refresh-btn" onclick="loadClients()" title="Atualizar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>E-MAIL</th>
          <th>STATUS</th>
          <th>TESTE GRÁTIS</th>
          <th>LIBERAR TESTE</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="4" class="loading-row">Carregando...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="mobile-list" id="mobile-list">
    <div class="loading-row">Carregando...</div>
  </div>
</div>

<script>
const SUPA_URL = 'https://uxiowjqicihksyakerys.supabase.co';
const SUPA_KEY = 'sb_publishable_9vGwq2rg2MLyEo67OE_rvA_Gbj8j_nb';
const TRIAL_DAYS = 30;

let _session = null;
let _clients = [];
let _filter = 'todos';

async function supa(path, method, body, token){
  method = method || 'GET'; body = body || null; token = token || null;
  const h={'Content-Type':'application/json','apikey':SUPA_KEY,'Prefer':'return=representation'};
  if(token) h['Authorization']='Bearer '+token;
  const opts={method:method,headers:h};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(SUPA_URL+path,opts);
  if(!r.ok){
    const e=await r.json().catch(function(){return {message:r.statusText};});
    throw new Error(e.error_description||e.message||'Erro Supabase '+r.status);
  }
  return r.status===204?null:r.json();
}
async function supaAuth(path,body){
  const r=await fetch(SUPA_URL+'/auth/v1'+path,{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPA_KEY},body:JSON.stringify(body)});
  const d=await r.json().catch(function(){return {};});
  if(!r.ok){
    const e=new Error(d.msg||d.error_description||d.message||d.error||'Erro de autenticação');
    throw e;
  }
  return d;
}

async function doAdminLogin(){
  const email=document.getElementById('admin-email').value.trim();
  const pass=document.getElementById('admin-pass').value;
  const err=document.getElementById('gate-err');
  const btn=document.getElementById('gate-btn');
  err.style.display='none';
  if(!email||!pass){ err.textContent='Preencha e-mail e senha.'; err.style.display='block'; return; }
  btn.disabled=true; btn.textContent='ENTRANDO...';
  try{
    const d=await supaAuth('/token?grant_type=password',{email:email,password:pass});
    _session={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};

    const rows=await supa(
      '/rest/v1/user_settings?user_id=eq.'+_session.user.id+'&select=is_admin',
      'GET',null,_session.access_token);
    const isAdmin = rows && rows.length && rows[0].is_admin===true;
    if(!isAdmin){
      _session=null;
      err.innerHTML='<div class="gate-denied">Este e-mail não tem permissão de administrador.</div>';
      err.style.display='block';
      btn.disabled=false; btn.textContent='ENTRAR';
      return;
    }

    sessionStorage.setItem('admin_session', JSON.stringify(_session));
    showDashboard();
  }catch(e){
    err.textContent = e.message.toLowerCase().indexOf('invalid')>-1 ? 'E-mail ou senha incorretos.' : e.message;
    err.style.display='block';
    btn.disabled=false; btn.textContent='ENTRAR';
  }
}

function doAdminLogout(){
  _session=null;
  sessionStorage.removeItem('admin_session');
  document.getElementById('dash').style.display='none';
  document.getElementById('gate').style.display='flex';
  document.getElementById('admin-pass').value='';
}

function showDashboard(){
  document.getElementById('gate').style.display='none';
  document.getElementById('dash').style.display='block';
  loadClients();
}

(async function restoreAdminSession(){
  const saved = sessionStorage.getItem('admin_session');
  if(!saved) return;
  try{
    const s = JSON.parse(saved);
    _session = s;
    const rows=await supa(
      '/rest/v1/user_settings?user_id=eq.'+_session.user.id+'&select=is_admin',
      'GET',null,_session.access_token);
    if(rows && rows.length && rows[0].is_admin===true){
      showDashboard();
    }else{
      sessionStorage.removeItem('admin_session');
    }
  }catch(e){ sessionStorage.removeItem('admin_session'); }
})();

['admin-email','admin-pass'].forEach(function(id){
  document.getElementById(id).addEventListener('keydown', function(e){ if(e.key==='Enter') doAdminLogin(); });
});

async function loadClients(){
  const tbody=document.getElementById('table-body');
  const mlist=document.getElementById('mobile-list');
  tbody.innerHTML='<tr><td colspan="4" class="loading-row">Carregando...</td></tr>';
  mlist.innerHTML='<div class="loading-row">Carregando...</div>';
  try{
    const settingsRows = await supa('/rest/v1/user_settings?select=user_id,email,trial_active,trial_started_at&order=email.asc',
        'GET',null,_session.access_token);
    const subRows = await supa('/rest/v1/subscriptions?select=email,status', 'GET',null,_session.access_token);
    const activeEmails = {};
    (subRows||[]).forEach(function(s){
      if(s.status==='active') activeEmails[(s.email||'').toLowerCase()]=true;
    });
    _clients = (settingsRows||[]).map(function(r){
      const email=(r.email||'').toLowerCase();
      const isSubscriber = !!activeEmails[email];
      let status='free', trialDaysLeft=null, trialExpired=false;
      if(isSubscriber){
        status='assinante';
      } else if(r.trial_active && r.trial_started_at){
        const startedAt=new Date(r.trial_started_at).getTime();
        const elapsedDays=(Date.now()-startedAt)/(1000*60*60*24);
        if(elapsedDays < TRIAL_DAYS){
          status='teste';
          trialDaysLeft = Math.max(0, Math.ceil(TRIAL_DAYS - elapsedDays));
        } else {
          trialExpired = true;
        }
      }
      return {
        user_id:r.user_id, email:r.email||'(sem e-mail)', status:status,
        trial_active:!!r.trial_active, trial_started_at:r.trial_started_at,
        trialDaysLeft:trialDaysLeft, trialExpired:trialExpired, isSubscriber:isSubscriber
      };
    });
    updateStats();
    renderTable();
  }catch(e){
    tbody.innerHTML='<tr><td colspan="4" class="dash-empty">Erro ao carregar: '+e.message+'</td></tr>';
    mlist.innerHTML='<div class="dash-empty">Erro ao carregar: '+e.message+'</div>';
  }
}

function updateStats(){
  document.getElementById('stat-total').textContent=_clients.length;
  document.getElementById('stat-assinantes').textContent=_clients.filter(function(c){return c.status==='assinante';}).length;
  document.getElementById('stat-teste').textContent=_clients.filter(function(c){return c.status==='teste';}).length;
  document.getElementById('stat-free').textContent=_clients.filter(function(c){return c.status==='free'||c.trialExpired;}).length;
}

function setFilter(f){
  _filter=f;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.f===f); });
  renderTable();
}

function trialBadgeHtml(c){
  if(c.status!=='teste'){
    return c.trialExpired
      ? '<span class="trial-timer expired">Expirado</span>'
      : '<span class="dash-empty">—</span>';
  }
  const d=c.trialDaysLeft;
  let cls='tg';
  if(d<=1) cls='tr';
  else if(d<=5) cls='ty';
  return '<span class="trial-timer '+cls+'">'+d+' dia'+(d===1?'':'s')+' restante'+(d===1?'':'s')+'</span>';
}

function statusBadgeHtml(c){
  if(c.status==='assinante') return '<span class="badge badge-assinante">ASSINANTE</span>';
  if(c.status==='teste') return '<span class="badge badge-teste">TESTE</span>';
  return '<span class="badge badge-free">FREE</span>';
}

function renderTable(){
  const term=document.getElementById('search-input').value.trim().toLowerCase();
  let list=_clients.filter(function(c){
    if(term && c.email.toLowerCase().indexOf(term)===-1) return false;
    if(_filter==='todos') return true;
    if(_filter==='free') return c.status==='free' || c.trialExpired;
    return c.status===_filter;
  });

  const tbody=document.getElementById('table-body');
  const mlist=document.getElementById('mobile-list');

  if(!list.length){
    tbody.innerHTML='<tr><td colspan="4" class="dash-empty">Nenhum cliente encontrado.</td></tr>';
    mlist.innerHTML='<div class="dash-empty">Nenhum cliente encontrado.</div>';
    return;
  }

  tbody.innerHTML = list.map(function(c){
    return '<tr>'+
      '<td class="email-cell">'+escapeHtml(c.email)+'</td>'+
      '<td>'+statusBadgeHtml(c)+'</td>'+
      '<td>'+trialBadgeHtml(c)+'</td>'+
      '<td>'+toggleHtml(c)+'</td>'+
    '</tr>';
  }).join('');

  mlist.innerHTML = list.map(function(c){
    return '<div class="m-card">'+
      '<div class="m-card-top"><div class="m-email">'+escapeHtml(c.email)+'</div>'+statusBadgeHtml(c)+'</div>'+
      '<div class="m-row"><span>Teste grátis</span>'+trialBadgeHtml(c)+'</div>'+
      '<div class="m-row"><span>Liberar teste</span>'+toggleHtml(c)+'</div>'+
    '</div>';
  }).join('');
}

function toggleHtml(c){
  const disabled = c.isSubscriber ? 'disabled title="Cliente assinante — não é necessário liberar teste"' : '';
  const on = (c.trial_active && !c.trialExpired) ? 'on' : '';
  return '<button class="toggle '+on+'" '+disabled+' onclick="toggleTrial(\''+c.user_id+'\', this)"></button>';
}

function escapeHtml(s){
  const d=document.createElement('div'); d.textContent=s; return d.innerHTML;
}

async function toggleTrial(userId, btnEl){
  const client=_clients.find(function(c){ return c.user_id===userId; });
  if(!client || client.isSubscriber) return;
  const willActivate = !(client.trial_active && !client.trialExpired);

  btnEl.classList.add('loading');
  btnEl.disabled=true;
  try{
    const payload = willActivate
      ? { trial_active:true, trial_started_at:new Date().toISOString() }
      : { trial_active:false };
    const r=await fetch(SUPA_URL+'/rest/v1/user_settings?user_id=eq.'+userId,{
      method:'PATCH',
      headers:{
        'Content-Type':'application/json','apikey':SUPA_KEY,
        'Authorization':'Bearer '+_session.access_token,'Prefer':'return=minimal'
      },
      body:JSON.stringify(payload)
    });
    if(!r.ok && r.status!==204){
      const e=await r.json().catch(function(){return {};});
      throw new Error(e.message||'Erro ao atualizar');
    }
    await loadClients();
  }catch(e){
    alert('Não foi possível atualizar: '+e.message);
    btnEl.classList.remove('loading');
    btnEl.disabled=false;
  }
}
</script>
</body>
</html>
